<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d110f">
<meta name="description" content="Entraîneur de poker No-Limit Hold'em avec coach, exercices, tournois et bilan.">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/svg+xml" href="logo.svg?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table du Coach">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#install-btn{position:fixed;right:16px;bottom:16px;z-index:50;border:0;border-radius:999px;padding:10px 16px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;background:#d9a043;color:#1d1305;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}</style>
</head>
<body>
<title>La Table du Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: en-tête (modes), bandeau de contexte, puis table + panneau à onglets (Coach / Historique / Bilan) ; une colonne sur téléphone. */
:root{
  --bg:#0d110f; --surface:#171e1a; --surface-2:#1e2722; --surface-3:#26312b; --ink:#e6ece8; --muted:#97a69d; --line:#2c3832;
  --felt:#1b5240; --felt-hi:#2a7058; --felt-lo:#0f3326; --rail-a:#6a4a30; --rail-b:#2a1c11;
  --brass:#d9a043; --brass-soft:#3b2d15; --brass-ink:#1d1305;
  --good:#4caf73; --warn:#e0a03a; --bad:#e2625a; --info:#5d92e2;
  --p-reg:#4f86d6; --p-station:#43a86c; --p-nit:#8676c9; --p-maniac:#d9654b; --p-fish:#d49a3a;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
/* Un seul univers visuel : salle de jeu sombre, lumière douce au-dessus de la table. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 90% 70% at 38% 30%,#1d2a23 0%,#121915 45%,var(--bg) 100%) fixed,var(--bg);min-height:100%;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:12px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.015em;margin:0}
.brand h1 span{color:var(--brass)}
.brand small{color:var(--muted);font-size:12.5px}
.topright{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.modes button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600}
.gear[aria-expanded="true"]{border-color:var(--brass);color:var(--brass)}

/* Bandeau de contexte */
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);min-height:46px}
.ctx .lab{font-family:var(--font-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.dchip small{font-family:var(--font-mono);font-weight:500;color:var(--muted);font-size:11px}
.dchip[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}

/* Réglages */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;box-shadow:var(--shadow)}
.settings h3{margin:0 0 10px}
.lvls{display:flex;flex-direction:column;gap:6px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.lvl:has(input:checked){border-color:var(--brass);background:var(--surface-2)}
.lvl b{font-size:13px}.lvl small{grid-column:2;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.fields{display:flex;flex-direction:column;gap:10px}
select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.seats{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px;font-size:13px}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.opts small{display:block;color:var(--muted);font-size:12px}
.legend{width:100%;border-collapse:collapse;font-size:12px}
.legend th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 4px}
.legend td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.legend td.n{font-family:var(--font-mono);white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:6px;vertical-align:middle}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.play{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Table */
.table-wrap{position:relative;width:100%;aspect-ratio:16/10.6;max-width:100%}
@media (max-width:620px){.table-wrap{aspect-ratio:10/13}}
.rail{position:absolute;inset:10% 6.5%;border-radius:50%;background:linear-gradient(170deg,var(--rail-a),var(--rail-b));padding:clamp(8px,1.5vw,15px);
  box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.felt{position:relative;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,var(--felt-hi),var(--felt) 55%,var(--felt-lo) 100%);box-shadow:inset 0 6px 28px rgba(0,0,0,.45)}
.felt::after{content:"";position:absolute;inset:13% 11%;border-radius:50%;border:1.5px solid rgba(255,255,255,.07)}
.mark{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-family:var(--font-display);font-weight:800;letter-spacing:.3em;font-size:clamp(9px,1vw,12px);
  color:rgba(255,255,255,.10);white-space:nowrap;text-transform:uppercase}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:66%}
.board{display:flex;gap:6px;min-height:66px;align-items:center}
.slot{width:46px;height:66px;border-radius:7px;border:1.5px dashed rgba(255,255,255,.16)}
.pot{font-family:var(--font-mono);font-size:13px;color:#f6ecd4;background:rgba(0,0,0,.3);padding:4px 12px 4px 26px;border-radius:999px;font-variant-numeric:tabular-nums;position:relative}
.pot::before{content:"";position:absolute;left:8px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle,#f2d9a0 0 30%,#c08628 32% 60%,#f2d9a0 62% 70%,#c08628 72%);}
.street-tag{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,236,212,.75);font-weight:700}
.banner{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:9px 16px;font-weight:600;text-align:center;max-width:64%;box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:13px;line-height:1.35}
.banner.ok{border-color:var(--good)}.banner.ko{border-color:var(--bad)}

.card{position:relative;display:inline-block;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.13);background:linear-gradient(165deg,#fffefa,#f2eee1);
  border:1px solid #d5cdb9;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.28);font-family:var(--font-display);flex:none}
.card.lg{--w:54px;--h:76px}.card.md{--w:46px;--h:66px}.card.sm{--w:30px;--h:43px}
.card .ci{position:absolute;left:9%;top:5%;display:flex;flex-direction:column;align-items:center;line-height:.92}
.card .ci b{font-size:calc(var(--w)*.37);font-weight:700;letter-spacing:-.04em}
.card .ci i{font-style:normal;font-size:calc(var(--w)*.27)}
.card .cc{position:absolute;right:9%;bottom:4%;font-size:calc(var(--w)*.56);line-height:1}
.card.sm .cc{display:none}.card.sm .ci{left:0;right:0;top:10%}
.card.s0{color:#1b1b1b}.card.s1{color:#c62f28}.card.s2{color:#2459c2}.card.s3{color:#26803c}
.card.back{background:#7a2620;background-image:repeating-linear-gradient(45deg,rgba(255,240,210,.10) 0 3px,transparent 3px 7px);border:2px solid #f3ead6;box-shadow:inset 0 0 0 2px #7a2620,0 4px 10px rgba(0,0,0,.28)}
.card.dim{filter:grayscale(.6);opacity:.55}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:var(--sw,clamp(96px,19%,150px))}
.seat .cards{display:flex;gap:3px;min-height:43px;align-items:flex-end}
.seat.hero .cards{min-height:76px}
.plate{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 8px 5px 5px;display:grid;grid-template-columns:auto 1fr auto;gap:0 7px;align-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.22);position:relative;overflow:hidden}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;background:var(--pc,#7b8780)}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.who .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .stk{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptag{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:1px 5px}
.who .pf{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.active .plate{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 4px 14px rgba(0,0,0,.25)}
.timer{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);animation:tm var(--t,700ms) linear forwards}
@keyframes tm{from{width:0}to{width:100%}}
.seat.folded .plate{opacity:.55}
.seat.out .plate{opacity:.35;border-style:dashed}
.seat.hero .plate{background:var(--surface-2)}
.act{min-height:22px;display:flex;justify-content:center}
.bub{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.3);font-variant-numeric:tabular-nums;
  background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.bub.fold{background:#59635e;color:#eef1ef;border-color:transparent}
.bub.call{background:var(--info);color:#fff;border-color:transparent}
.bub.raise{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.bub.allin{background:var(--bad);color:#fff;border-color:transparent}
.bub.win{background:var(--good);color:#fff;border-color:transparent}
.bub.fresh{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bub.fresh,.timer{animation:none}}
.say{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);background:#f6f1e3;color:#1b1b1b;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:4;animation:fadeup .3s ease-out}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#f6f1e3}
.dealer{position:absolute;width:22px;height:22px;border-radius:50%;background:#f7f2e4;color:#222;font:800 11px/22px var(--font-display);text-align:center;
  box-shadow:0 2px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.chip{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11.5px;background:#f4e8cb;color:#2a1c06;
  padding:2px 9px 2px 20px;border-radius:999px;font-weight:600;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.chip::before{content:"";position:absolute;left:5px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,#c08628 30% 58%,#fff 60% 68%,#c08628 70%)}

/* Actions */
.actions{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:70px;justify-content:center;box-shadow:var(--shadow)}
.ticker{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.ticker b{color:var(--ink);font-weight:600}
.ticker .st{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--brass);font-weight:800;margin-right:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 16px;font-weight:600;min-width:104px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.fold{color:var(--bad)}
.btn.main{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-width:0;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font-family:var(--font-mono);font-size:10px;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.sizing{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preset{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-family:var(--font-mono)}
.preset.prec{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.sizing input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--brass)}
.sizing input[type=number]{width:80px;font:inherit;font-family:var(--font-mono);padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink)}
.wait{color:var(--muted)}
.log{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  max-height:120px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.log .st{color:var(--ink);font-weight:600}

/* Panneau */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0;box-shadow:var(--shadow)}
@media (min-width:981px){.panel{max-height:calc(100vh - 24px)}}
@media (max-width:980px){.panel{position:static}}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tabs .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-left:4px}
.pbody{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
h3{font-family:var(--font-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.spot{font-size:13px;color:var(--muted);margin:0}
.spot b{color:var(--ink)}
.rec{border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--muted)}
.rec.fold{border-left-color:var(--bad)}.rec.call,.rec.check{border-left-color:var(--warn)}.rec.raise{border-left-color:var(--good)}
.rec .verb{font-family:var(--font-display);font-size:23px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.rec p{margin:0;font-size:13.5px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.keys li{font-size:13.5px;line-height:1.4;display:grid;grid-template-columns:82px 1fr;gap:8px}
.keys li > b{font-family:var(--font-display);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);padding-top:3px}
.arrow{color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
details[open] > summary{margin-bottom:10px}
.dbody{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:7px}
.sec p{margin:0;font-size:12.5px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--surface-2);border-radius:10px;padding:8px 9px;min-width:0}
.num span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.num b{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere}
.num b.pos{color:var(--good)}.num b.neg{color:var(--bad)}
.eqbar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.eqbar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--good)}
.eqbar .fill.low{background:var(--bad)}
.eqbar .need{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.eqlegend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.cmp td:first-child{font-weight:600}
.cmp td.ev{font-family:var(--font-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp tr.best td.ev{color:var(--good);font-weight:600}
.rtag{display:inline-block;font-size:10px;font-weight:600;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:0 6px;margin-left:4px}
.reads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.reads li{font-size:12.5px;line-height:1.45;padding-left:10px;border-left:3px solid var(--line)}
.reads li.new{border-left-color:var(--brass)}
.dist{display:flex;flex-direction:column;gap:4px;font-size:12.5px}

<script>
/* =========================================================
   Cartes et évaluation
   ========================================================= */
const RANKS='23456789TJQKA', SUITS=['♠','♥','♦','♣'];
const rk=c=>c>>2, st=c=>c&3;
const rname=r=>r===8?'10':RANKS[r];
const CAT=['Hauteur','Paire','Deux paires','Brelan','Quinte','Couleur','Full','Carré','Quinte flush'];
function straightHigh(m){const m2=(m<<1)|((m>>12)&1);for(let hi=13;hi>=4;hi--){if(((m2>>(hi-4))&31)===31)return hi-1;}return -1;}
function evalHand(cs){
  const rc=new Int8Array(13),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sc[s]++;sm[s]|=1<<r;mask|=1<<r;}
  let fm=0;
  for(let s=0;s<4;s++)if(sc[s]>=5){fm=sm[s];const h=straightHigh(fm);if(h>=0)return 8e6+h;}
  let quad=-1;const trips=[],pairs=[],singles=[];
  for(let r=12;r>=0;r--){const n=rc[r];if(n===4)quad=r;else if(n===3)trips.push(r);else if(n===2)pairs.push(r);else if(n===1)singles.push(r);}
  if(quad>=0){let k=-1;for(let r=12;r>=0;r--)if(r!==quad&&rc[r]){k=r;break;}return 7e6+quad*15+(k+1);}
  if(trips.length&&(trips.length>1||pairs.length)){const p=Math.max(trips[1]??-1,pairs[0]??-1);return 6e6+trips[0]*15+p;}
  if(fm){let v=0,n=0;for(let r=12;r>=0&&n<5;r--)if(fm>>r&1){v=v*15+r;n++;}return 5e6+v;}
  const h=straightHigh(mask);if(h>=0)return 4e6+h;
  const k=i=>(singles[i]??-1)+1;
  if(trips.length)return 3e6+trips[0]*225+k(0)*15+k(1);
  if(pairs.length>=2){const kk=Math.max(pairs[2]??-1,singles[0]??-1)+1;return 2e6+pairs[0]*225+pairs[1]*15+kk;}
  if(pairs.length)return 1e6+pairs[0]*3375+k(0)*225+k(1)*15+k(2);
  return k(0)*50625+k(1)*3375+k(2)*225+k(3)*15+k(4);
}
const cat=s=>Math.floor(s/1e6);
const cardTxt=c=>rname(rk(c))+SUITS[st(c)];

/* Classement des 169 mains de départ (formule de Chen) */
const PF={};
(function(){
  const pts=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  const list=[];
  for(let i=12;i>=0;i--)for(let j=i;j>=0;j--){
    if(i===j){list.push({k:RANKS[i]+RANKS[j],c:6,s:Math.max(5,pts(i)*2),t:i*13+j+.9});continue;}
    for(const su of [true,false]){let s=pts(i)+(su?2:0);const g=i-j-1;s-=g<=0?0:g===1?1:g===2?2:g===3?4:5;if(g<=1&&i<10)s+=1;
      list.push({k:RANKS[i]+RANKS[j]+(su?'s':'o'),c:su?4:12,s:Math.ceil(s),t:i*13+j+(su?.5:0)});}
  }
  list.sort((a,b)=>b.s-a.s||b.t-a.t);let cum=0;for(const h of list){cum+=h.c;PF[h.k]=cum/1326;}
})();
function handKey(h){const a=rk(h[0]),b=rk(h[1]);const hi=Math.max(a,b),lo=Math.min(a,b);if(hi===lo)return RANKS[hi]+RANKS[lo];return RANKS[hi]+RANKS[lo]+(st(h[0])===st(h[1])?'s':'o');}

/* =========================================================
   Ranges du guide
   ========================================================= */
function addHand(set,k){if(k.length===3)set.add(k);else{set.add(k+'s');set.add(k+'o');}}
function R(str){const set=new Set();
  for(let t of str.split(',')){t=t.trim().replace('–','-');if(!t)continue;
    if(t.includes('-')){const [a,b]=t.split('-');
      if(a[0]===a[1]){let x=RANKS.indexOf(a[0]),y=RANKS.indexOf(b[0]);if(x<y)[x,y]=[y,x];for(let r=y;r<=x;r++)set.add(RANKS[r]+RANKS[r]);}
      else{let x=RANKS.indexOf(a[1]),y=RANKS.indexOf(b[1]);if(x<y)[x,y]=[y,x];for(let r=y;r<=x;r++)addHand(set,a[0]+RANKS[r]+(a[2]||''));}
      continue;}
    const plus=t.endsWith('+');if(plus)t=t.slice(0,-1);
    if(t[0]===t[1]){const r0=RANKS.indexOf(t[0]);for(let r=r0;r<=(plus?12:r0);r++)set.add(RANKS[r]+RANKS[r]);continue;}
    const h=RANKS.indexOf(t[0]),l=RANKS.indexOf(t[1]);for(let r=l;r<=(plus?h-1:l);r++)addHand(set,t[0]+RANKS[r]+(t[2]||''));}
  return set;}
const RFI={
  EP:R('55+, A9s+, KTs+, QTs+, JTs, T9s, AJo+, KQo'),
  UTG:R('22+, A2s+, KTs+, QTs+, J9s+, T9s, 98s, 87s, AJo+, KQo'),
  HJ:R('22+, A2s+, K9s+, Q9s+, J9s+, T8s+, 97s+, 87s, 76s, ATo+, KJo+, QJo'),
  CO:R('22+, A2s+, K6s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 75s+, 65s, 54s, A9o+, KTo+, QTo+, JTo'),
  BTN:R('22+, A2s+, K2s+, Q4s+, J6s+, T6s+, 96s+, 85s+, 74s+, 64s+, 53s+, 43s, A2o+, K8o+, Q9o+, J9o+, T8o+, 98o'),
  SB:R('22+, A2s+, K5s+, Q7s+, J8s+, T8s+, 97s+, 86s+, 75s+, 65s, 54s, A7o+, K9o+, QTo+, JTo'),
  HU:R('22+, A2s+, K2s+, Q2s+, J4s+, T6s+, 95s+, 85s+, 74s+, 63s+, 53s+, 43s, A2o+, K5o+, Q7o+, J8o+, T8o+, 97o+, 87o')
};
const RFI_PCT={EP:'~12 %',UTG:'~16 %',HJ:'~20 %',CO:'~27 %',BTN:'~45 %',SB:'~40 %',HU:'~75 %'};
const SETS={
  vert:R('TT+, AK, AQ, AJs, KQs'),
  orange:R('22-99, A2s-ATs, KJs, QJs, JTs, T9s, 98s, AJo, KQo'),
  rouge:R('KTs, QTs, J9s, 87s, 76s, 65s, ATo, KJo, QJo'),
  v3early:R('QQ+, AK'), b3early:R('A5s, A4s'), callEarly:R('99-JJ, AQs, AJs, KQs'),
  v3late:R('QQ+, AK, AQs'), b3late:R('A5s, A4s, KTs'), callLate:R('22-JJ, AJs, ATs, KQs, KJs, QJs, JTs, T9s, AQo'),
  v3sb:R('TT+, AQ+, AJs, KQs'), b3sb:R('A5s-A2s, K9s, 76s, 65s'),
  b3bbLate:R('A5s-A2s, K8s, 65s, 54s'), b3bbEarly:R('A5s, A4s'),
  bbLate:R('22+, A2s+, K2s+, Q5s+, J7s+, T7s+, 96s+, 85s+, 74s+, 64s+, 53s+, 43s, A2o+, K8o+, Q9o+, J9o+, T8o+, 98o, 87o'),
  bbEarly:R('22+, A2s+, K9s+, Q9s+, J9s+, T8s+, 97s+, 87s, 76s, 65s, ATo+, KJo+, QJo'),
  squeeze:R('QQ+, AK'), sqCall:R('22-JJ, AJs, KQs, QJs, JTs, T9s, 98s'),
  bbIso:R('TT+, AJ+, KQs'),
  fourBet:R('KK+, AK'), call3IP:R('QQ, JJ, TT, AQs'), call3OOP:R('QQ, JJ, AQs'), premium:R('QQ+, AK')
};
function colorOf(k){return SETS.vert.has(k)?'vert':SETS.orange.has(k)?'orange':SETS.rouge.has(k)?'rouge':'gris';}
const COLOR_TXT={vert:'vert',orange:'orange',rouge:'rouge',gris:'hors tableau'};
function rfiKey(pos){const n=G.seat.length;if(n===2)return pos==='BTN'?'HU':null;
  if(['UTG','UTG1','UTG2'].includes(pos))return n>=8?'EP':'UTG';if(pos==='MP')return 'UTG';return RFI[pos]?pos:null;}
const rfiFor=pos=>{const k=rfiKey(pos);return k?RFI[k]:new Set();};
const PUSH={UTG:.11,UTG1:.12,UTG2:.13,MP:.15,HJ:.19,CO:.25,BTN:.36,SB:.5};
function pushPct(pos,E){const n=G.seat.length;let b=n===2?.62:n===3&&pos==='BTN'?.45:(PUSH[pos]||.15);return Math.min(.9,b*(E<=60?1.4:E<=80?1.15:1));}

/* =========================================================
   Profils, niveaux, formats, réglages
   ========================================================= */

function replaceBot(i,why){const old=P[i].name;const arch=archPool()[Math.floor(Math.random()*archPool().length)];const nm=freshName();
  seatBot(i,arch,nm);P[i].stack=startStack();P[i].out=false;say(P[i],'hello',.5);

  for(let i=1;i<N;i++)if(P[i].stack<=0)replaceBot(i,'est à sec et quitte la table');

/* Profil perçu : réel si visible, sinon déduit des statistiques observées */
function observedClass(o){if(o.h<8)return null;const v=o.v/o.h,r=o.r/o.h;
  if(v<.17)return 'nit';if(v>=.38&&r>=.24)return 'maniac';if(v>=.38)return 'station';if(r<.09&&v>=.25)return 'fish';return 'reg';}
function perceived(q){if(!S.hide)return q.prof;return observedClass(q.obs)||'reg';}

function obsTxt(q){const o=q.obs;const st2=!S.hide&&q.sty?`Style : joue ~${pct(q.sty.vpip)}, relance ~${pct(q.sty.pfr)}. `:'';return st2+(o.h?`VPIP ${pct(o.v/o.h)} · PFR ${pct(o.r/o.h)} sur ${o.h} mains observées`:'aucune main observée');}

/* =========================================================
   Simulations
   ========================================================= */
function freshDeck(excl){const used=new Set(excl);const d=[];for(let c=0;c<52;c++)if(!used.has(c))d.push(c);return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function simEq(hand,board,nOpp,iters){
  const base=freshDeck([...hand,...board]);let tot=0;
  for(let it=0;it<iters;it++){
    const d=shuffle(base.slice());let k=0;const opp=[];for(let o=0;o<nOpp;o++)opp.push([d[k++],d[k++]]);
    const b=board.slice();while(b.length<5)b.push(d[k++]);
    const me=evalHand([...hand,...b]);let ties=1,lose=false;
    for(const h of opp){const s=evalHand([...h,...b]);if(s>me){lose=true;break;}if(s===me)ties++;}
    if(!lose)tot+=1/ties;
  }return tot/iters;}
function drawInfo(hand,board){
  const all=[...hand,...board];const sc=[0,0,0,0];all.forEach(c=>sc[st(c)]++);
  let flush=false;for(let s=0;s<4;s++)if(sc[s]===4&&hand.some(c=>st(c)===s))flush=true;
  let mask=0;all.forEach(c=>mask|=1<<rk(c));const m2=(mask<<1)|((mask>>12)&1);
  const hm=hand.reduce((m,c)=>m|(1<<(rk(c)+1))|(rk(c)===12?1:0),0);
  let straight=false;for(let lo=0;lo<=9;lo++){const w=(31<<lo);let n=0;for(let b=lo;b<lo+5;b++)if(m2>>b&1)n++;if(n===4&&(hm&w))straight=true;}
  return {flush,straight};}
function pfCap(q,prx){
  const pr=prx||params(q);const short=q.stack+q.contrib<=130;
  if(short&&(q.pf==='open'||q.pf==='3bet'))return {cap:Math.min(.6,pr.pfr*1.6),low:0,why:'à tapis court, on fait tapis plus large'};
  switch(q.pf){
    case 'open':return {cap:Math.min(.6,pr.pfr*1.35),low:0,why:`il relance ~${pct(pr.pfr)} de ses mains en moyenne, un peu plus en fin de parole`};
    case '3bet':return {cap:Math.max(.035,pr.tb*1.2),low:0,why:`il ne sur-relance que ~${pct(pr.tb)} de ses mains`};
    case '4bet':return {cap:.03,low:0,why:"un 4-bet, c'est presque toujours QQ+ ou AK"};
    case 'call':return q.blindCall?{cap:Math.min(1,pr.vpip*1.7),low:0,why:'depuis les blindes, on défend plus large car on a déjà payé une partie'}
      :{cap:Math.min(1,pr.vpip*1.1),low:pr.tb*.5,why:`il joue ~${pct(pr.vpip)} de ses mains, sans les toutes meilleures (qu'il aurait sur-relancées)`};
    case 'limp':return {cap:Math.min(1,pr.vpip*1.15),low:pr.pfr*.6,why:`il joue ~${pct(pr.vpip)} de ses mains, sans les meilleures (qu'il aurait relancées)`};
  }
  return {cap:1,low:0,why:"il n'a pas encore montré d'intérêt particulier"};}
function rangeOk(q,h,board,prx){
  const pr=prx||params(q);const p=PF[handKey(h)];const {cap,low}=pfCap(q,pr);
  if(p>cap||p<low)return false;
  const lens={flop:3,turn:4,river:5};
  for(const s of ['flop','turn','river']){
    if(board.length<lens[s])break;
    if(!q.agg[s]&&!q.call[s])continue;
    const b=board.slice(0,lens[s]);const made=cat(evalHand([...h,...b]))>cat(evalHand(b));
    let accept;
    if(made)accept=1;else{const di=s==='river'?{}:drawInfo(h,b);const draw=di.flush||di.straight;
      accept=q.agg[s]?(draw?.6:Math.max(.04,pr.bluff*1.4)):(draw?.85:.15+.45*pr.loose);}
    if(Math.random()>accept)return false;
  }
  return true;}
function sampleRange(q,n){
  const base=freshDeck([...P[0].hand,...G.board]);const out=[];
  for(let k=0;k<n;k++){let h;for(let t=0;t<40;t++){const a=base[Math.floor(Math.random()*base.length)],b=base[Math.floor(Math.random()*base.length)];if(a===b)continue;h=[a,b];if(rangeOk(q,h,G.board))break;}out.push(h);}
  return out;}
function heroEq(iters){
  const hero=P[0];const opps=P.filter(p=>!p.hero&&!p.folded);
  const base=freshDeck([...hero.hand,...G.board]);let tot=0;
  for(let it=0;it<iters;it++){
    const used=new Set();const hands=[];
    for(const q of opps){let h;for(let t=0;t<40;t++){
        const a=base[Math.floor(Math.random()*base.length)],b=base[Math.floor(Math.random()*base.length)];
        if(a===b||used.has(a)||used.has(b))continue;h=[a,b];if(rangeOk(q,h,G.board))break;}
      if(!h){const free=base.filter(c=>!used.has(c));h=[free[0],free[1]];}
      used.add(h[0]);used.add(h[1]);hands.push(h);}
    const b=G.board.slice();const rest=shuffle(base.filter(c=>!used.has(c)));let k=0;while(b.length<5)b.push(rest[k++]);
    const me=evalHand([...hero.hand,...b]);let ties=1,lose=false;
    for(const h of hands){const s=evalHand([...h,...b]);if(s>me){lose=true;break;}if(s===me)ties++;}
    if(!lose)tot+=1/ties;
  }return tot/iters;}
function outs(hand,board){
  if(board.length<3||board.length>=5)return {n:0};
  const cur=cat(evalHand([...hand,...board]));if(cur>=4)return {n:0};
  let n=0;for(const c of freshDeck([...hand,...board])){const v=cat(evalHand([...hand,...board,c]));const bo=cat(evalHand([...board,c]));if(v>=4&&v>bo)n++;}
  const di=drawInfo(hand,board);
  return {n,label:di.flush&&di.straight?'couleur + quinte':di.flush?'tirage couleur':di.straight?'tirage quinte':''};}
function texture(b){
  const sc=[0,0,0,0];b.forEach(c=>sc[st(c)]++);const mx=Math.max(...sc);
  const rs=[...new Set(b.map(rk))].sort((x,y)=>x-y);let conn=false;
  for(let i=0;i+2<rs.length;i++)if(rs[i+2]-rs[i]<=4)conn=true;
  if(rs.includes(12)&&rs.filter(r=>r<=3).length>=2)conn=true;
  const paired=rs.length<b.length;const wet=mx>=3||conn||(mx===2&&rs[rs.length-1]-rs[0]<=6&&b.length===3);
  const bits=[];if(mx>=3)bits.push(b.length===3?'monotone':'3 cartes de la même couleur');else if(mx===2&&b.length===3)bits.push('deux cartes de la même couleur');
  if(conn)bits.push('cartes proches');if(paired)bits.push('pairé');
  return {wet,label:(wet?'humide':'sec')+(bits.length?' ('+bits.join(', ')+')':'')};}

   ========================================================= */
function seatedFrom(b){const r=[];for(let k=0;k<N;k++){const i=(b+k)%N;if(!P[i].out)r.push(i);}return r;}
function nextSeated(i){for(let k=1;k<=N;k++){const j=(i+k)%N;if(!P[j].out)return j;}return i;}
function refundCurrent(){if(G.over)return;for(const p of P)p.stack+=p.contrib;G.over=true;}
function newHand(){
  if(G.mode==='exos'){if(G.exam&&!G.exam.done)return nextExamQ();if(G.exam&&G.exam.done)G.exam=null;return startDrill(S.drill);}
  restoreSwap();
  if(G.mode==='tournoi'){
    if(!G.t||G.t.done)return startTournament();
    G.t.hands++;G.levelMsg='';
    if(G.t.hands>1&&(G.t.hands-1)%G.t.every===0){G.t.level++;P.forEach(p=>{if(!p.out)p.stack=Math.max(1,Math.round(p.stack/1.5));});
      G.levelMsg=`Niveau ${G.t.level} : les blindes montent (×1,5). Vos tapis valent moins de grosses blindes.`;}
  }else{
    if(N!==FORMATS[S.format].n)buildPlayers(FORMATS[S.format].n);
    G.note='';G.levelMsg='';tableLife();for(const p of P){p.out=false;if(p.stack<=0){p.stack=startStack();if(p.hero)G.note='Tu étais à court de jetons : nouveau tapis.';}}
  }
  applySeats();
  G.button=nextSeated(G.button);G.drill=null;
  deal({});
}
function deal(opts){
  G.handNo++;G.seat=seatedFrom(G.button);
  const deck=shuffle(freshDeck([]));
  for(const p of P){Object.assign(p,{hand:null,mucked:false,folded:false,allin:false,bet:0,contrib:0,acted:false,pf:null,blindCall:false,agg:{},call:{},score:null,won:0,act:null,hv:false,hr:false});
    if(p.out)p.folded=true;else p.hand=[deck.pop(),deck.pop()];}
  if(opts.heroFn){let t=0;while(!opts.heroFn(handKey(P[0].hand))&&t++<800){deck.push(...P[0].hand);shuffle(deck);P[0].hand=[deck.pop(),deck.pop()];}}
  if(opts.boardFn){for(let t=0;t<600;t++){const ix=new Set();while(ix.size<3)ix.add(Math.floor(Math.random()*deck.length));const ids=[...ix];const b=ids.map(j=>deck[j]);
    if(opts.boardFn(b)){ids.sort((a,c)=>c-a).forEach(j=>deck.splice(j,1));deck.push(b[2],b[1],b[0]);break;}}}
  Object.assign(G,{deck,board:[],street:'preflop',currentBet:0,minRaise:10,raiseCount:0,pfAgg:-1,over:false,log:[],heroDec:[],rec:null,verdict:null,result:'',resultClass:'',
    startStack:P[0].stack,heroLast:null,valueNote:'',heroTo:null,paused:false,justKo:false,reads:[],lastAgg:-1,readsSeen:0,streetActs:[],showRec:S.coach==='full',spot:null});
  const n=G.seat.length,sb=n===2?G.seat[0]:G.seat[1],bb=n===2?G.seat[1]:G.seat[2];
  post(P[sb],5);post(P[bb],10);G.currentBet=10;P[bb].pf='bb';
  P[sb].act={k:'blind',t:'PB 0,5'};P[bb].act={k:'blind',t:'GB 1'};
  if(G.mode==='tournoi'&&G.t.level>=2&&!G.drill){const a=Math.min(10,P[bb].stack);P[bb].stack-=a;P[bb].contrib+=a;if(!P[bb].stack)P[bb].allin=true;}
  G.log.push({st:true,t:`${G.drill?'Exercice':'Main'} n° ${G.handNo} — ${P[G.button].name} au bouton`});
  if(G.levelMsg){G.log.push({st:true,t:G.levelMsg});}

      if(toCall===0)return {type:'check'};

    if(G.raiseCount===0){const limpers=P.filter(q=>q.pf==='limp').length;
      const rs=rfiFor(pos);const opens=pr.smart&&['reg','maniac'].includes(p.prof)&&rs.size?(rs.has(key)||(p.prof==='maniac'&&pc<=pr.pfr)):pc<=pr.pfr*late;
      if(opens){let base=25;if(p.prof==='fish')base=Rn<.25?20:[30,35,40][Math.floor(Rn*3)%3];else if(p.prof==='maniac')base=30;else if(p.prof==='nit')base=Rn<.5?25:30;else if(p.prof==='station')base=30;
        return raiseTo(p,base+10*limpers);}
      if(pos==='SB'&&limpers>0&&['fish','station'].includes(p.prof)&&pc<=pr.vpip*1.4)return {type:'call'};
      if(!pr.smart&&pc<=pr.vpip*late)return toCall===0?{type:'check'}:{type:'call'};
      if(pr.smart&&p.prof!=='reg'&&pc<=pr.vpip*late*.8)return toCall===0?{type:'check'}:{type:'call'};
      return toCall===0?{type:'check'}:{type:'fold'};}
    if(G.raiseCount===1){const ip=order(i)>order(G.pfAgg);const callers=P.filter(q=>q!==p&&q.pf==='call').length;
      if(callers&&['reg','maniac'].includes(p.prof)&&(pc<=pr.tb*1.6||(SETS.b3early.has(key)&&Rn<.5)))return raiseTo(p,r5(G.currentBet*(4+callers)));
      if(pc<=pr.tb*late)return raiseTo(p,r5(G.currentBet*(p.prof==='fish'?3.5+Rn*1.5:ip?3:4)));

  if(p.prof==='station'){
    if(toCall>0){if(cls==='monster'&&Rn<.3)return raiseTo(p,r5(G.currentBet*2.5));if(cls!=='air'||Rn<.1)return toCall>pot*1.5&&cls==='weak'&&Rn<.5?{type:'fold'}:{type:'call'};return {type:'fold'};}

  if(p.prof==='fish'){

    if(eq>=.88&&G.street==='flop'&&Rn<.35)return {type:'check'};
    if(was&&(eq>=.45||scare)&&Rn<pr.aggr*.9)return raiseTo(p,r5(pot*(scare?.75:.6)));
    if(G.street==='river'&&eq>=.55&&eq<pr.vt&&Rn<.55)return raiseTo(p,r5(pot*.45));
  }
  if(eq>=pr.vt&&Rn<.45+pr.aggr*.5){const f=pr.smart?(texture(G.board).wet?.7:.45):(pr.aggr>.7?.75:pr.loose>.8?.5:.6);return raiseTo(p,r5(pot*f));}
  if(G.pfAgg===i&&G.street==='flop'&&Rn<pr.aggr*.9)return raiseTo(p,r5(pot*.33));
  if(cls==='air'&&Rn<bl)return raiseTo(p,r5(pot*(pr.smart&&G.street==='river'?.75:.5)));
  if(cls==='medium'&&ipp&&G.street==='river'&&Rn<.35)return raiseTo(p,r5(pot*.4));

function botAct(i){if(G.over||G.actor!==i)return;botExec(i,botChoose(i));}
function botExec(i,d){if(G.over||G.actor!==i)return;const c=commentBot(i,d);if(c)G.reads.push({street:G.street,...c,who:i});act(i,d.type,d.to);}
function botChoose(i){let d=botDecide(i);const p=P[i],pr=eff(p),toCall=G.currentBet-p.bet;
  if(pr.mist&&Math.random()<pr.mist){
    if(d.type==='fold'&&toCall>0&&toCall<p.stack*.3)d={type:'call'};
    else if(d.type==='call'&&G.street!=='preflop')d={type:'fold'};
    else if(d.type==='check'&&G.street!=='preflop')d=raiseTo(p,Math.max(10,Math.round(potTotal()*.5/5)*5));}
  return d;}

function rangeDesc(cap,low=0){
  const ks=Object.keys(PF).filter(k=>PF[k]<=cap&&PF[k]>low).sort((a,b)=>PF[a]-PF[b]);
  if(!ks.length)return '';if(ks.length<=4)return ks.join(', ');
  return `de ${ks[0]} jusqu'à des mains comme ${ks.slice(-3).reverse().join(', ')}`;}
function commentBot(i,d){

  const R2=(s,l)=>({s,l:p.tilt?((l?l+' ':'')+'Il est en tilt après une grosse perte : il joue plus large et plus agressif que d\'habitude.'):l});
  if(G.street==='preflop'){
    if(d.type==='fold')return vsHero?R2(`${nm} se couche face à ta relance.`,null):null;
    if(d.type==='check')return null;
    if(d.type==='call'){
      if(G.raiseCount===0)return R2(`${nm} limpe → main moyenne, bonne cible pour une relance d'isolation.`,
        passive?"Les joueurs passifs limpent souvent des mains moyennes qu'ils n'osent pas relancer.":"Rare chez ce profil : main qu'il veut voir pas cher, ou piège.");
      const blind=['SB','BB'].includes(pos);const c=Math.min(1,pr.vpip*(blind?1.7:1.1));
      return R2(`${nm} paie la relance → ${pr.loose>.7?'range très large, ne le bluffe pas':'main correcte mais rarement premium'}.`,
        `Range estimée ~${Math.round(c*100)} % des mains (${rangeDesc(c,blind?0:pr.tb*.5)}). Sans ses toutes meilleures mains : avec elles, il aurait sur-relancé.`);}
    const rc=G.raiseCount+1;
    if(allin&&p.stack+p.bet<=130)return R2(`${nm} fait tapis avec un tapis court → range large, typique du push/fold.`,'Avec moins de 12 bb, on fait tapis avec beaucoup de mains : paie plus large que face à une relance normale, mais pas avec n\'importe quoi.');
    if(rc===1){const c=Math.min(.6,pr.pfr*1.35);
      return R2(`${nm} relance depuis ${pos} → ~${Math.round(c*100)} % des mains${key==='maniac'?', souvent légères':key==='nit'?', très solides':''}.`,
        `Il relance ~${pct(pr.pfr)} de ses mains en moyenne (un peu plus en fin de parole) : ${rangeDesc(c)}.`);}
    const c=rc===2?Math.max(.035,pr.tb*1.2):.03;
    return R2(`${nm} ${rc===2?'sur-relance (3-bet)':'relance encore (4-bet)'}${allin?' à tapis':''} → ${key==='maniac'?'peut être un bluff':'main très forte'}.`,
      `Ce profil ne sur-relance que ~${pct(pr.tb)} de ses mains : ${rangeDesc(c)}.`);}

  if(d.type==='check'){
    if(G.pfAgg===i&&G.street==='flop')return R2(`${nm} ne mise pas après avoir relancé → il a souvent raté le flop.`,"Celui qui a relancé avant le flop mise souvent au flop (c-bet). Ne pas le faire signale souvent une main faible.");

    return null;}
  if(d.type==='call')return R2(`${nm} paie au ${S2} → ${key==='station'?'il paie avec presque tout':'main moyenne ou tirage'}.`,
    key==='station'?'Continue de miser tes bonnes mains : il paiera avec des mains plus faibles.':'Assez pour continuer, probablement pas assez pour relancer.');

    f>=.85?'Une grosse mise est « polarisée » : très forte main ou bluff, rarement entre les deux.':f<.42?'Une petite mise cherche à se faire payer par des mains faibles ou à gagner le pot pour pas cher.':null);}

function blockerNote(hand,board){

  for(let s2=0;s2<4;s2++)if(sc[s2]>=3&&hand.some(c=>st(c)===s2&&rk(c)===12)&&cat(evalHand([...hand,...board]))<5)return `Tu as l'As de ${SUITS[s2]} : il ne peut pas avoir la couleur max, ton bluff est plus crédible.`;
  const top=Math.max(...board.map(rk));if(hand.some(c=>rk(c)===top)&&cat(evalHand([...hand,...board]))<=1)return `Tu as un ${rname(top)} : il a moins de combinaisons de top paire, donc il se couche plus souvent.`;
  return '';}
function bluffRec(row,q,facing){

  const r=mk('raise',row.to,verb,`${q.name} (${plabel(q)}) doit se coucher ${pct(row.req)} du temps pour que ce bluff rapporte ; d'après ses actions, il se couche ~${pct(row.fold)}.${facing?' Et si on te paie, ton tirage peut encore rentrer.':''}${bl?' '+bl:''}`,
    "Un bon bluff réunit trois choses : une main sans valeur à l'abattage (checker ne gagne presque jamais), un adversaire capable de se coucher, et une histoire crédible (tu pourrais avoir une grosse main).");
  r.bluff=true;return r;}
function geoFrac(pot,stack,n){return (Math.pow(1+2*stack/Math.max(10,pot),1/n)-1)/2;}

  if(biggest&&biggest!==row&&biggest.fold>row.fold+.08)reason+=` Une mise de ${fmt(biggest.to)} ne serait payée que ~${pct(1-biggest.fold)} du temps.`;
  else if(row===biggest&&row.fold<.4)reason+=' Il paie presque tout : fais-le payer cher.';

    nit:"Contre un joueur serré : mises petites à moyennes. Il ne paie qu'avec des mains correctes et lâche tout face aux grosses mises.",maniac:'Contre un agressif : mise moyen, il relancera souvent en bluff. Tu peux aussi checker pour le laisser miser.',
    reg:tex.wet?'Board humide : mise assez gros pour faire payer les tirages, nombreux ici.':'Board sec : il a peu de mains qui paient, une mise moyenne ou petite le garde dans le coup.'}[key]||'Choisis la taille que des mains moins bonnes peuvent payer.';

  const o=outs(h.hand,G.board);const tex=G.board.length?texture(G.board):null;
  let rec=G.street==='preflop'?coachPre():coachPost(eq,req,o,tex);

  const cmp=G.street!=='preflop'&&opps.length===1?evOptions():null;
  if(cmp&&toCall===0&&eq>=.6)rec=valueRec(cmp,opps[0],eq,tex);
  else if(cmp&&toCall===0){
    const q=opps[0],ck=cmp[0],bets=cmp.slice(1),bb=bets.reduce((a,b)=>b.ev>a.ev?b:a);
    const near=rec.type==='raise'?bets.reduce((a,b)=>Math.abs(b.to-rec.to)<Math.abs(a.to-rec.to)?b:a):null;
    if(near&&eq<.65&&ck.ev-near.ev>10)rec=mk('check',0,'Checke',`${q.name} continue trop souvent pour qu'une mise sans grosse main soit rentable.`,'Ne mise pas « pour voir » : il faut une raison (value, ou un adversaire qui se couche assez).');

  }

    if(rec.type!=='raise'&&o.n>=8&&G.street!=='river'&&!['station','fish'].includes(perceived(q))&&rr.ev-Math.max(cmp[0].ev,cmp[1].ev)>10)rec=bluffRec(rr,q,true);}

}

function leaks(){

  const list=[];for(const [spot,s] of Object.entries(by))for(const [dir,c] of Object.entries(s.dirs))list.push({spot,dir,c,n:s.n});
  list.sort((a,b)=>b.c-a.c||b.c/b.n-a.c/a.n);return {by,list};}
function sparkSVG(){

  const seatSel=i=>`<select id="seat-${i}" data-seat="${i}">${PROF_KEYS.map(k=>`<option value="${k}" ${(P[i]&&P[i].prof||S.seats[i-1])===k?'selected':''}>${PROFILES[k].label}</option>`).join('')}</select>`;
  el.innerHTML=`
  <div><h3>Niveau des adversaires</h3><div class="lvls">${[1,2,3].map(l=>`<label class="lvl"><input type="radio" name="lvl" id="lvl-${l}" value="${l}" ${S.level===l?'checked':''}><b>${LEVELS[l].label}</b><small>${LEVELS[l].desc}</small></label>`).join('')}</div></div>
  <div><h3>Format</h3><div class="fields">
    <label class="field">Nombre de joueurs<select id="opt-format">${Object.entries(FORMATS).map(([k,f])=>`<option value="${k}" ${S.format===k?'selected':''}>${f.label}</option>`).join('')}</select></label>
    <label class="field">Tapis en partie libre<select id="opt-stack">${[20,50,100,200].map(v=>`<option value="${v}" ${S.stackBB===v?'selected':''}>${v} bb</option>`).join('')}</select></label>
    <label class="field">Type de tournoi<select id="opt-ttype"><option value="sng" ${S.tType==='sng'?'selected':''}>Sit & Go (format choisi ci-dessus)</option><option value="spin" ${S.tType==='spin'?'selected':''}>Spin & Go (3 joueurs, 25 bb, hyper-rapide)</option></select></label>
    <label class="field">Tapis de départ en Sit & Go<select id="opt-tstack">${[20,30,50,100].map(v=>`<option value="${v}" ${S.tStack===v?'selected':''}>${v} bb</option>`).join('')}</select></label>
    <p class="note">Le format s'applique à la prochaine main (partie libre) ou au prochain tournoi. Blindes : ×1,5 toutes les 6 mains, ante à partir du niveau 2.</p></div></div>
  <div><h3>Composition de la table</h3>
    <label class="field">Type de table<select id="tabletype">${Object.entries(TABLES).map(([k,t])=>`<option value="${k}" ${S.table===k?'selected':''}>${t.label}</option>`).join('')}</select></label>
    <div class="seats">${Array.from({length:n-1},(_,j)=>j+1).map(i=>`<span><span class="dot" style="--pc:${PCOL(P[i]?P[i].prof:S.seats[i-1])}"></span>${P[i]?P[i].name:ALLNAMES[i]}</span>${seatSel(i)}`).join('')}</div>
    <p class="note">Le profil donne la base ; chaque joueur a ses propres dosages, qui dérivent avec le temps. Changer un siège passe la table en « Personnalisée ».</p></div>
  <div><h3>Options</h3><div class="opts">
    <label><input type="checkbox" id="opt-hide" ${S.hide?'checked':''}><span>Profils cachés<small>Devine le style de chaque joueur. Le coach se base seulement sur ce qu'il a observé (VPIP/PFR).</small></span></label>
    <label><input type="checkbox" id="opt-quiz" ${S.quizOn?'checked':''}><span>Quiz éclair entre les mains<small>Une question rapide (cotes, outs, ranges, combinaisons) à la fin de la plupart des mains.</small></span></label>
    <label><input type="checkbox" id="opt-chat" ${S.chat?'checked':''}><span>Messages des joueurs<small>Petites phrases après un gros pot, à l'arrivée d'un joueur ou quand il s'énerve.</small></span></label>
    <label><input type="checkbox" id="opt-rotate" ${S.rotate?'checked':''}><span>Table vivante<small>En partie libre, des joueurs partent et d'autres arrivent, les joueurs ruinés sont remplacés, et un gros pot perdu peut mettre un joueur en tilt.</small></span></label>
    <label><input type="checkbox" id="opt-pause" ${S.pauseAll?'checked':''}><span>Pause après chaque décision<small>Même quand ton coup est bon : le jeu attend que tu aies lu l'explication. Par défaut, la pause n'a lieu qu'après une erreur.</small></span></label>
    <label><input type="checkbox" id="opt-reveal" ${S.reveal?'checked':''}><span>Montrer toutes les mains en fin de coup<small>Pour comprendre ce qu'ils avaient, même couchés.</small></span></label>
    <label class="field">Vitesse des adversaires<select id="opt-speed">${['lent','normal','rapide'].map(v=>`<option value="${v}" ${S.speed===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label>
  </div></div>
  <div><h3>Les profils</h3><table class="legend"><thead><tr><th>Profil</th><th>Joue / relance</th><th>Style</th></tr></thead><tbody>
    ${PROF_KEYS.map(k=>`<tr><td><span class="dot" style="--pc:${PCOL(k)}"></span><b>${PROFILES[k].label}</b></td><td class="n">${pct(PROFILES[k].vpip)} / ${pct(PROFILES[k].pfr)}</td><td>${PROFILES[k].desc}</td></tr>`).join('')}</tbody></table>
    <p class="note">« Joue » = VPIP, % des mains où il met de l'argent. « Relance » = PFR, % des mains où il relance avant le flop.</p></div>`;}
function setMode(m){
  if(m===G.mode&&!(m==='tournoi'&&G.t&&G.t.done))return;
  G.exam=null;restoreSwap();
  refundCurrent();if(G.drill&&G.saved)P.forEach((p,k)=>{p.stack=G.saved[k];});
  const prev=G.mode;G.mode=m;S.mode=m;saveS();
  if(m==='tournoi'){startTournament();return;}
  if(prev==='tournoi'){buildPlayers(FORMATS[S.format].n);}
  if(m==='exos'){startDrill(S.drill);return;}
  G.drill=null;newHand();}
function heroAction(a){
  if(a==='next'){newHand();return;}
  if(a==='show'){G.showRec=true;render();return;}
  if(a==='exam-retry'){startExam(G.exam.step);return;}
  if(a==='exam-quit'){G.exam=null;setMode('cash');return;}
  if(a==='resume'){if(G.paused){G.paused=false;step();}return;}
  if(a==='reset'){G.confirmReset=true;renderPanel();return;}
  if(a==='reset-no'){G.confirmReset=false;renderPanel();return;}
  if(a==='reset-yes'){Object.assign(G,{quizStats:{n:0,ok:0},pathDone:[],stats:{hands:0,vpip:0,pfr:0},cashNet:0,decs:[],hist:[],drillStats:{},tourneys:[],hm:{faced:0,foldBet:0,post:0,aggr:0},confirmReset:false});saveSession();render();return;}
  if(G.over||G.actor!==0||!needs(P[0]))return;
  if(a==='raise')act(0,'raise',G.heroTo);else act(0,a);}
function init(){
  loadSession();
  document.addEventListener('click',e=>{
    if(G.showCombos&&!e.target.closest('#combos')&&!e.target.closest('#combos-btn')){G.showCombos=false;renderCombos();}
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.coach){S.coach=b.dataset.coach;saveS();if(G.rec)G.showRec=S.coach==='full'&&!G.exam;render();return;}
    if(b.dataset.mode){setMode(b.dataset.mode);return;}
    if(b.dataset.exam!==undefined){startExam(+b.dataset.exam);return;}
    if(b.dataset.ttype){S.tType=b.dataset.ttype;saveS();refundCurrent();startTournament();return;}
    if(b.id==='combos-btn'){G.showCombos=!G.showCombos;renderCombos();return;}
    if(b.dataset.qa!==undefined){answerQuiz(+b.dataset.qa);return;}
    if(b.dataset.rsit){S.rangeSit=b.dataset.rsit;saveS();renderPanel();return;}
    if(b.dataset.rpos){S.rangePos=b.dataset.rpos;saveS();renderPanel();return;}
    if(b.dataset.tab){S.tab=b.dataset.tab;saveS();renderPanel();return;}
    if(b.dataset.drill){G.exam=null;S.drill=b.dataset.drill;saveS();refundCurrent();if(G.drill&&G.saved)P.forEach((p,k)=>{p.stack=G.saved[k];});startDrill(S.drill);return;}
    if(b.dataset.train){G.exam=null;S.drill=b.dataset.train;S.tab='coach';saveS();if(G.mode==='exos'){refundCurrent();if(G.drill&&G.saved)P.forEach((p,k)=>{p.stack=G.saved[k];});startDrill(S.drill);}else setMode('exos');return;}
    if(b.dataset.copy!==undefined){const hh=G.hist[+b.dataset.copy];const txt=histText(hh);const box=$('cbox-'+b.dataset.copy);
      const fallback=()=>{box.innerHTML=`<textarea class="copybox" readonly id="cta-${b.dataset.copy}">${txt}</textarea>`;const ta=box.querySelector('textarea');ta.focus();ta.select();};
      try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copié !';},fallback);}catch(_){fallback();}return;}
    if(b.id==='gear'){G.showSettings=!G.showSettings;renderSettings();return;}
    if(b.dataset.p){setAmt(+b.dataset.p);return;}
    const a=b.dataset.a;if(a)heroAction(a);
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='amt-range')setAmt(+e.target.value);
    if(e.target.id==='amt-num'){const v=parseFloat(String(e.target.value).replace(',','.'));if(!isNaN(v))setAmt(Math.round(v*10));}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.name==='lvl'){S.level=+t.value;}
    else if(t.id==='tabletype'){S.table=t.value;G.seatsDirty=true;if(t.value==='aleatoire')S.seats=S.seats.map(()=>PROF_KEYS[Math.floor(Math.random()*PROF_KEYS.length)]);else if(TABLES[t.value].seats)S.seats=TABLES[t.value].seats.slice();renderSettings();}
    else if(t.dataset.seat){S.seats=P.slice(1).map(q=>q.prof).concat(S.seats.slice(N-1)).slice(0,8);S.seats[+t.dataset.seat-1]=t.value;S.table='perso';G.seatsDirty=true;renderSettings();}
    else if(t.id==='opt-hide')S.hide=t.checked;
    else if(t.id==='opt-reveal')S.reveal=t.checked;
    else if(t.id==='opt-pause')S.pauseAll=t.checked;
    else if(t.id==='opt-rotate')S.rotate=t.checked;
    else if(t.id==='opt-speed')S.speed=t.value;
    else if(t.id==='opt-format'){S.format=t.value;renderSettings();}
    else if(t.id==='opt-stack')S.stackBB=+t.value;
    else if(t.id==='opt-tstack')S.tStack=+t.value;
    else if(t.id==='opt-ttype')S.tType=t.value;
    else if(t.id==='opt-quiz')S.quizOn=t.checked;
    else if(t.id==='opt-chat')S.chat=t.checked;
    else return;
    saveS();render();
  });
  document.addEventListener('toggle',e=>{if(e.target.id==='det')G.detailsOpen=e.target.open;
    if(e.target.dataset&&e.target.dataset.hk!==undefined){const k=+e.target.dataset.hk;if(e.target.open)G.histOpen=k;else if(G.histOpen===k)G.histOpen=null;}},true);
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key.toLowerCase();
    if(G.paused&&k==='enter'){e.preventDefault();heroAction('resume');return;}
    if(G.over&&G.quiz&&G.quiz.ans===null&&/^[1-4]$/.test(k)&&+k<=G.quiz.opts.length){answerQuiz(+k-1);return;}
    if(k==='escape'&&G.showCombos){G.showCombos=false;renderCombos();return;}
    if(G.over&&k==='enter'){e.preventDefault();newHand();return;}
    if(G.over||G.actor!==0)return;
    if(k==='f')heroAction('fold');
    else if(k==='c')heroAction(G.currentBet>P[0].bet?'call':'check');
    else if(k==='r'&&P[0].bet+P[0].stack>G.currentBet)heroAction('raise');
    else if(/^[1-5]$/.test(k)){const b=document.querySelectorAll('.preset')[+k-1];if(b)b.click();}
  });
  G.mode=S.mode==='tournoi'?'cash':S.mode;
  buildPlayers(FORMATS[S.format].n);
  if(S.mode==='tournoi'){G.mode='tournoi';startTournament();}else if(G.mode==='exos')startDrill(S.drill);else newHand();
}
if(typeof document!=='undefined')init();
</script>

<button id="install-btn" hidden>Installer l'appli</button>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=3').catch(()=>{}));}
let deferredPrompt=null;const ib=document.getElementById('install-btn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.hidden=false;});
ib.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.hidden=true;});
addEventListener('appinstalled',()=>{ib.hidden=true;});
</script>
